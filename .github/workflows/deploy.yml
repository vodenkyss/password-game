name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Stáhne tvůj kód z GitHubu do virtuálního počítače
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Připraví Node.js prostředí (verze 20)
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) Nainstaluje balíčky (to samé jako když píšeš npm install na Macu)
      - name: Install dependencies
        run: npm install

      # 4) Vygeneruje výslednou složku /dist
      - name: Build
        run: npm run build

      # 5) Připraví prostředí pro GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6) Vezme složku /dist a zabalí ji jako balíček pro web
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist